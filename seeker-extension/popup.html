<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 240px;
            height: 125px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
        }

        button#analyze {
            background: #f97316;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
            width: 100%;
            box-shadow: 0 4px 6px -1px rgba(249, 115, 22, 0.2);
        }

        button#analyze:hover {
            background: #ea580c;
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.3);
        }

        button#analyze:active {
            transform: translateY(0);
        }

        .title {
            color: #0f172a;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .description {
            color: #64748b;
            font-size: 11px;
            margin-bottom: 12px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title">ResumXpert</div>
        <div class="description">AI-Powered Resume Optimization & Analysis</div>
        <button id="analyze">Analyze Profile</button>
    </div>
    <script src="popup.js"></script>
</body>

</html>
